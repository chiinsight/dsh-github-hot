# ============================================================================
# dsh-github-hot 的 bundle patch —— 把插件挂进 DSH 配置树
# ============================================================================
#
# 【约定】
#   - id 必须全局唯一且与包名一致：宿主按它比对 entryId，裸名会与其它插件冲突。
#   - 声明 id 的那一行不能写行尾注释，否则解析器无法取到值。
# ============================================================================

- insert:
    - id: dsh-github-hot
      name: 'dsh-github-hot'
